# Enable after DNS, HTTPS issuance and application deployment.
# This file adds a certificate site; existing primary-domain sites are separate.
map $uri $certificate_cache_policy {
    default "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}
server {
    listen 80;
    server_name cert.guanchaohuiji.com;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/cert.guanchaohuiji.com; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name cert.guanchaohuiji.com;
    ssl_certificate /www/server/panel/vhost/letsencrypt/cert.guanchaohuiji.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/letsencrypt/cert.guanchaohuiji.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /www/wwwroot/conference-system/apps/admin/dist;
    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control $certificate_cache_policy always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location = / { try_files /certificate.html =404; }
    location ~ ^/c/[A-Za-z0-9_-]{1,64}/?$ {
        try_files /certificate.html =404;
    }
    location ^~ /assets/ {
        try_files $uri =404;
    }
    location ^~ /api/certificates/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 45s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location / { return 404; }
}
